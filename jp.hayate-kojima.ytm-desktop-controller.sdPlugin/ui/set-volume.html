<!DOCTYPE html>
<html>
<head lang="en">
    <title>Set Volume Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Port">
        <sdpi-textfield setting="port" global placeholder="26538" pattern="\d*"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Volume (0-100, steps of 5)">
        <sdpi-textfield setting="volume" placeholder="e.g. 50" pattern="\d*"></sdpi-textfield>
    </sdpi-item>
    <script src="setup-link.js"></script>
</body>
</html>
