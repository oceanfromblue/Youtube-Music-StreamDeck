<!DOCTYPE html>
<html>
<head lang="en">
    <title>Add Playlist to Queue Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Port">
        <sdpi-textfield setting="port" global placeholder="26538" pattern="\d*"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Playlist">
        <sdpi-textfield setting="playlistId" placeholder="Playlist link or ID" required></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Shuffle">
        <sdpi-checkbox setting="shuffle" label="Shuffle Playlist"></sdpi-checkbox>
    </sdpi-item>
    <sdpi-item label="When pressed">
        <sdpi-select setting="queueMode" default="end">
            <option value="end">Add to the end of the queue</option>
            <option value="replace">Play now (replace the queue)</option>
            <option value="next">Play next (keep the queue)</option>
        </sdpi-select>
    </sdpi-item>
    <div id="artwork-options"></div>
    <script src="artwork-options.js"></script>
    <script src="setup-link.js"></script>
</body>
</html>
